[project]
name = "bcn-half"
version = "0.1.0"
description = "Watch the Barcelona Half marketplace and open safe bib application workflows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["playwright==1.60.0"]

[project.scripts]
bcn-half = "bcn_half.bot:cli"
captchano-demo = "bcn_half.captchano_demo:cli"

[dependency-groups]
dev = [
    "click>=8.5.0",
    "pyright>=1.1.414",
    "pysonar>=1.10.0.5888",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
    "truststore>=0.10.5",
    "vulture>=2.16",
]

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
