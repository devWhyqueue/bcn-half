[project]
name = "bcn-half"
version = "0.1.0"
description = "Watch the Barcelona Half marketplace, alert via Telegram, and apply for bibs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "audioop-lts>=0.2.2 ; python_full_version >= '3.13'",
    "patchright==1.64.4",
    "pypasser[speech,vision]==1.1.0",
]

[project.scripts]
bcn-half = "bcn_half.bot:cli"

[dependency-groups]
dev = [
    "click>=8.5.0",
    "pyright>=1.1.414",
    "pysonar>=1.10.0.5888",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
    "truststore>=0.10.5",
    "vulture>=2.16",
]

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"

[tool.vulture]
ignore_names = [
    "handle_starttag",
    "handle_endtag",
    "handle_data",
    # PyPasser selector overrides in captcha.configure_solver
    "CHECKBOX_FRAME",
    "AUDIO_FRAME",
    "TOKEN_SELECTORS",
]
